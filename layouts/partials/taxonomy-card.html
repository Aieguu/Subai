{{ $kind := .kind }}
{{ $title := .title }}
{{ $url := .url }}
{{ $count := .count }}

<article class="taxonomy-card taxonomy-card-{{ $kind }}">
  <a href="{{ $url }}" class="taxonomy-card-link">
    <div class="taxonomy-card-content">
      <div class="taxonomy-card-header">
        <h2 class="taxonomy-card-title">{{ $title }}</h2>
      </div>

      <div class="taxonomy-card-meta">
        <span class="taxonomy-post-count">{{ $count }} 篇文章</span>
      </div>

      <div class="taxonomy-card-icon" aria-hidden="true">
        {{ partial "icon.html" (dict "name" (cond (eq $kind "category") "category" "tag") "class" "icon") }}
      </div>
    </div>
  </a>
</article>
